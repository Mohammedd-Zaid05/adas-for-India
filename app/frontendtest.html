<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADAS India</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    header {
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 600;
      color: #f8fafc;
    }

    header span {
      font-size: 0.8rem;
      background: #2563eb;
      color: white;
      padding: 2px 10px;
      border-radius: 999px;
    }

    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>🛣️ ADAS India</h1>
    <span>v1.0</span>
  </header>

  <main>
    <p style="color: #64748b;">Dashboard loading...</p>

</html>
